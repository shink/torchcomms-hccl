name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install lint tools
        run: pip install pylint clang-format

      - name: clang-format check
        run: |
          find csrc -name '*.hpp' -o -name '*.cpp' -o -name '*.h' \
            | xargs clang-format --dry-run --Werror

      - name: pylint check
        run: pylint torchcomms_hccl/
